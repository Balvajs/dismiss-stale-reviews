# `dist/main.mjs` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `main.mjs` is the code that will run.
# For our project, we generate this file through a build process from other source files.
# We need to make sure the checked-in `main.mjs` actually matches what we expect it to be.
#
# Two things make the bundle machine-specific and this job fail:
# - the `--define __filename=…` in the `package` script. Without it bun writes
#   the build-time absolute path of every bundled CJS module that reads
#   `__filename` (undici, via @octokit/action) into the bundle.
# - a `node_modules` that was not installed clean. bun install neither prunes
#   nor re-hoists, and the bundle embeds each module's resolved path, so a
#   nested copy produces different bytes than a hoisted one.
name: Check dist/

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # for checkout

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and bun
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild the dist/ directory
        run: bun package

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
        id: diff

name: 'build-test'
on:
  pull_request:

permissions:
  contents: read # for checkout

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and bun
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun all

  runner: # the runner must be able to load `main:` from action.yml
    # one clone and one API call — the 1 vCPU image is enough, and it ships
    # both git and node
    runs-on: ubuntu-slim
    permissions:
      contents: read # for checkout
      pull-requests: read # the action reads the PR data via GraphQL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the action diffs against `origin/<base branch>`, which a shallow
          # checkout doesn't have — without the full history it throws and the
          # error path tries to dismiss every approval of this PR
          fetch-depth: 0

      # runs against this very PR, so every input is set to a no-op — the step
      # only proves the runner executes the committed dist/main.mjs
      - uses: ./
        with:
          ignore-files: '**'
          no-owner-action: dismiss-none
          force-push-action: dismiss-none

  e2e: # run the built action against real fixture PRs and assert review states
    # fork PRs have no access to the e2e secrets
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and bun
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build dist
        run: bun run package

      - name: Get token for the fixture repository
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.E2E_APP_CLIENT_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: balvajs-actions
          repositories: dismiss-stale-reviews-e2e

      - name: Run e2e scenarios
        run: bun e2e/run-e2e.ts
        env:
          E2E_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          E2E_REVIEWER_PAT: ${{ secrets.E2E_REVIEWER_PAT }}
          E2E_REVIEWER2_PAT: ${{ secrets.E2E_REVIEWER2_PAT }}

      - name: Clean up leftover fixtures
        if: always() && steps.app-token.outputs.token
        run: bun e2e/cleanup-run.ts
        env:
          E2E_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          E2E_REVIEWER_PAT: ${{ secrets.E2E_REVIEWER_PAT }}
          E2E_REVIEWER2_PAT: ${{ secrets.E2E_REVIEWER2_PAT }}
